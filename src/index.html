<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
<title>DNSwitch</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-refresh" viewBox="0 0 20 20"><path d="M16.5 10a6.5 6.5 0 1 1-2-4.7M16.5 3.5v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-globe" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3c2 2 3 4.3 3 7s-1 5-3 7c-2-2-3-4.3-3-7s1-5 3-7z"/></g></symbol>
    <symbol id="i-pencil" viewBox="0 0 20 20"><path d="M12.5 4.5l3 3M4 16l.7-3.2L13.2 4.3a1.4 1.4 0 0 1 2 0l.5.5a1.4 1.4 0 0 1 0 2l-8.5 8.5L4 16z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6 6l.6 9.5a1 1 0 0 0 1 .9h4.8a1 1 0 0 0 1-.9L14 6M8.5 9v4M11.5 9v4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 20 20"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a10.5 10.5 0 0 1 15 0M5.2 10.9a6.7 6.7 0 0 1 9.6 0M7.9 13.7a2.9 2.9 0 0 1 4.2 0"/></g><circle cx="10" cy="16" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 20 20"><path d="M5.5 8l4.5 4.5L14.5 8" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<main>
  <header>
    <img src="../assets/icon.png" alt="" class="logo" width="44" height="44">
    <div class="titles">
      <h1>DNSwitch</h1>
      <p class="sub" id="ssid">Detecting connection…</p>
    </div>
    <button id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh"><svg class="ic"><use href="#i-refresh"/></svg></button>
  </header>

  <div id="banner" class="banner hidden" role="alert"></div>

  <section class="card hero" id="current" aria-labelledby="hero-label">
    <div class="hero-top">
      <span id="mode" class="chip neutral"><i></i>—</span>
      <label class="adapter" for="adapter">
        <svg class="ic"><use href="#i-wifi"/></svg>
        <span class="sr">Network interface</span>
        <select id="adapter"></select>
      </label>
    </div>
    <h2 id="hero-label" class="label">Current DNS</h2>
    <div class="readout">
      <div class="primary num" id="cur1">—</div>
      <div class="secondary num" id="cur2">—</div>
    </div>
    <button id="auto" class="btn ghost wide">Reset to automatic DNS</button>
  </section>

  <section class="card" aria-labelledby="presets-label">
    <div class="card-head">
      <h2 id="presets-label" class="label">Presets</h2>
      <button id="add-preset" class="btn ghost sm"><svg class="ic"><use href="#i-plus"/></svg>New</button>
    </div>
    <ul id="presets" class="presets"></ul>
  </section>

  <section class="card" aria-labelledby="custom-label">
    <h2 id="custom-label" class="label">Custom</h2>
    <div class="fields">
      <input id="c1" class="num" placeholder="Preferred DNS server" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Preferred DNS server">
      <input id="c2" class="num" placeholder="Alternate DNS server (optional)" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="Alternate DNS server">
    </div>
    <div class="actions">
      <button id="apply-custom" class="btn primary">Apply</button>
      <button id="save-custom" class="btn ghost">Save as preset</button>
    </div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h2 id="dlg-title" class="title">Preset</h2>
    <input id="p-name" placeholder="Name" maxlength="40" autocomplete="off" aria-label="Preset name">
    <input id="p-1" class="num" placeholder="Preferred DNS server" autocomplete="off" spellcheck="false" aria-label="Preferred DNS server">
    <input id="p-2" class="num" placeholder="Alternate DNS server (optional)" autocomplete="off" spellcheck="false" aria-label="Alternate DNS server">
    <p id="dlg-err" class="err hidden" role="alert"></p>
    <div class="actions end">
      <button type="button" id="dlg-cancel" class="btn ghost">Cancel</button>
      <button type="submit" id="dlg-save" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="confirm">
  <form method="dialog" id="confirm-form">
    <h2 class="title">Delete preset</h2>
    <p id="confirm-msg" class="confirm-msg"></p>
    <div class="actions end">
      <button type="button" id="confirm-no" class="btn ghost">Cancel</button>
      <button type="submit" id="confirm-yes" class="btn danger">Delete</button>
    </div>
  </form>
</dialog>

<div id="busy" class="busy hidden" role="status"><div class="spin"></div><span id="busy-msg">Applying…</span></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="renderer.js"></script>
</body>
</html>
