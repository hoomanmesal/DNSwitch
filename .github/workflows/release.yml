name: Release

# Push a tag such as v1.0.1 to build the Windows installer and portable exe and the Linux AppImage and .deb,
# and attach them to a DRAFT release.
# Review the draft on GitHub, then press Publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build AppImage and .deb
        run: npm run dist:linux -- --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg. Bump the version, commit, and re-tag."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: node tools/release-notes.js "$GITHUB_REF_NAME" > release-notes.md

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build installer and portable exe
        run: npm run dist -- --publish never

      - name: Get the Linux build
        uses: actions/download-artifact@v7
        with:
          name: linux-build
          path: dist

      - name: Checksums
        shell: pwsh
        run: |
          Set-Location dist
          Get-ChildItem *-setup.exe, *-portable.exe, *.AppImage, *.deb | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --draft $flags \
            --title "DNSwitch ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            dist/*-setup.exe dist/*-portable.exe dist/*.AppImage dist/*.deb dist/SHA256SUMS.txt
