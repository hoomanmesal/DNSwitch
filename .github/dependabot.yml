version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["electron-builder", "puppeteer-core", "@fontsource-variable/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
